server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    # CV uploads (F0.1): files up to 5 MB plus multipart overhead; matches CvEndpoints.MaxRequestBytes (6 MB).
    # nginx's default of 1m would reject valid CVs before they reach the API.
    client_max_body_size 6m;
    # CV parsing has a 55 s budget; keep nginx's upstream read timeout above it.
    proxy_read_timeout 75s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
